name: Docker build and run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sentrix:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name sentrix             -p 8080:8080             sentrix:test
          sleep 8
          docker ps --filter name=sentrix

      - name: Wait for dashboard health endpoint
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Dashboard healthy after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard never responded with 200"
          docker logs sentrix
          exit 1

      - name: Hit a couple of dashboard endpoints
        run: |
          curl -fs http://localhost:8080/api/health         | head -c 200; echo
          curl -fs http://localhost:8080/api/summary        | head -c 200; echo
          curl -fs -o /dev/null -w "dashboard html status: %{http_code}\n" http://localhost:8080/

      - name: Container logs (for debug)
        if: always()
        run: docker logs sentrix | tail -40

      - name: Stop container
        if: always()
        run: docker stop sentrix || true
