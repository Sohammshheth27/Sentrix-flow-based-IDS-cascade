# SMB Allowlist — trusted hosts that may make SMB/RPC connections.
# The rules engine will not flag SMB lateral movement from these IPs.
# Edit this file to match your office's actual network topology.
#
# Each entry needs:
#   ip:   the IPv4 address of the trusted host
#   role: a label for your reference (gateway, dns, dc, it_admin, etc.)

trusted_hosts:
